[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ri-station-harmonization"
version = "0.1.0"
description = "Cross-infrastructure station metadata harmonisation pilot (ACTRIS / ICOS / eLTER)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31", "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3",
    "rapidfuzz>=3.0", "geopandas>=0.14", "shapely>=2.0", "pyproj>=3.5",
    "matplotlib>=3.7", "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
